<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestAn Web - 문항분석 도구</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>TestAn Web</h1>
  <p class="subtitle">고전적 문항분석(CTT) 도구 · 원본: TestAn 1.0 for Windows (VB6, 2000)</p>
</header>

<main>
  <section class="panel">
    <div class="file-row">
      <label class="file-box">
        <strong>응답 데이터 (.dat)</strong>
        <input type="file" id="inputFile" accept=".dat,.txt">
        <span id="inputFileName">파일을 선택하세요</span>
      </label>
      <label class="file-box">
        <strong>정답 데이터 (.dat, 선택)</strong>
        <input type="file" id="answerFile" accept=".dat,.txt">
        <span id="answerFileName">없으면 데이터 파일의 정답키 사용</span>
      </label>
      <button id="loadDemo" class="btn">샘플 데이터로 보기</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="input" class="active">입력 데이터</button>
    <button data-tab="score">점수 결과</button>
    <button data-tab="item">문항 분석</button>
    <button data-tab="option">답지 분석</button>
    <button data-tab="graph">그래프</button>
  </nav>

  <section id="tab-input" class="tab-content">
    <h2>입력 데이터</h2>
    <div id="inputSummary" class="summary"></div>
    <table class="data-table" id="inputTable"></table>
  </section>

  <section id="tab-score" class="tab-content" hidden>
    <h2>점수 결과</h2>
    <div id="scoreSummary" class="summary"></div>
    <table class="data-table" id="scoreTable"></table>
  </section>

  <section id="tab-item" class="tab-content" hidden>
    <h2>문항 분석</h2>
    <div class="controls">
      <label>정렬:
        <select id="itemSort">
          <option value="index">문항 순서</option>
          <option value="diffAsc">난이도 오름차순</option>
          <option value="diffDesc">난이도 내림차순</option>
          <option value="discDesc">변별도 내림차순</option>
        </select>
      </label>
      <button id="downloadOut" class="btn">결과 파일 (.out)</button>
      <button id="downloadScr" class="btn">점수 파일 (.scr)</button>
      <button id="downloadSrt" class="btn">난이도 정렬 (.srt)</button>
      <button id="downloadSrtDisc" class="btn">변별도 정렬 (.srt)</button>
    </div>
    <table class="data-table" id="itemTable"></table>
  </section>

  <section id="tab-option" class="tab-content" hidden>
    <h2>답지 분석</h2>
    <div class="controls">
      <label>문항:
        <select id="optionItem"></select>
      </label>
      <span id="optionSummary" class="summary"></span>
    </div>
    <table class="data-table" id="optionTable"></table>
  </section>

  <section id="tab-graph" class="tab-content" hidden>
    <h2>그래프</h2>
    <div class="controls">
      <label>항목:
        <select id="graphMode">
          <option value="diff">문항 난이도(정답률)</option>
          <option value="disc">문항 변별도</option>
          <option value="score">점수 분포</option>
        </select>
      </label>
    </div>
    <canvas id="chart" width="900" height="400"></canvas>
  </section>
</main>

<footer>
  <p>GitHub Pages로 배포되는 정적 웹 앱입니다. 모든 계산은 브라우저에서 수행됩니다.</p>
</footer>

<script src="js/parser.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
